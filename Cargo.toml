[workspace]
resolver = "3"
members = [
    "crates/snowcone-core",
    "crates/snowcone",
    "crates/snowcone-backends",
    "crates/backends/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
snowcone-core = { path = "crates/snowcone-core" }
snowcone-backends = { path = "crates/snowcone-backends" }

anyhow = "1"
async-trait = "0.1"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7"
